rulesets:
  - name: ANS repository checks
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    bypass_actors: []
    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: true
          required_status_checks:
            - context: Build
              integration_id: 15368
            - context: Clippy
              integration_id: 15368
            - context: Clippy (fast-verify)
              integration_id: 15368
            - context: Coverage (90% threshold)
              integration_id: 15368
            - context: DCO
              integration_id: 1861
            - context: Dependency Compliance
              integration_id: 15368
            - context: Documentation
              integration_id: 15368
            - context: Format
              integration_id: 15368
            - context: MSRV (1.88, fast-verify)
              integration_id: 15368
            - context: MSRV (1.88)
              integration_id: 15368
            - context: Security Audit
              integration_id: 15368
            - context: Test
              integration_id: 15368
            - context: Test (fast-verify)
              integration_id: 15368
  - name: ANS Maintainer merges
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    bypass_actors:
      - actor_type: Team
        name: sdk-rust-maintainers
        bypass_mode: pull_request
      - actor_type: Team
        name: tsc-owners
        bypass_mode: pull_request
    rules:
      - type: update
