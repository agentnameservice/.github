# Repository rulesets: additive protections on GitHub Free public repos.
suborgrepos: ['*', '.*']
ruleset_scope: repo

rulesets:
  - name: ANS baseline
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include: ['~DEFAULT_BRANCH']
        exclude: []
    bypass_actors: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: true
          require_last_push_approval: false
          required_review_thread_resolution: true
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: true
          required_status_checks:
            - context: DCO
              integration_id: 1861

labels:
  include:
    - name: issue-required
      color: fbca04
      description: A tracking issue or proposal is required before merge
    - name: proposal
      color: '0e8a16'
      description: A proposed change requiring a recorded decision
    - name: needs-proposal
      color: fbca04
      description: A proposal decision is needed before implementation can merge
    - name: accepted
      color: '0e8a16'
      description: Proposal accepted
    - name: accepted-with-changes
      color: '0e8a16'
      description: Proposal accepted with changes recorded in the decision
    - name: declined
      color: b60205
      description: Proposal declined with reasons recorded in the decision
    - name: nomination
      color: 1d76db
      description: Reviewer or Maintainer nomination
    - name: spec-tracking
      color: d93f0b
      description: Implementation work associated with a specification change
    - name: release
      color: '0052cc'
      description: Release coordination
    - name: editorial
      color: '0075ca'
      description: No normative specification change
    - name: normative
      color: d93f0b
      description: Changes a specification requirement
    - name: stale
      color: ededed
      description: Awaiting author response under the ANS inactivity policy
    - name: awaiting-author
      color: fbca04
      description: Changes requested with no pending review request; inactivity clock starts here
    - name: needs-info
      color: d876e3
      description: Additional information is needed
