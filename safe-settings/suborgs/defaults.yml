# Repository rulesets: additive protections on GitHub Free public repos.
suborgrepos: ['*', '.*']
ruleset_scope: repo

rulesets:
  - name: ANS baseline
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include: ['~DEFAULT_BRANCH']
        exclude: []
    bypass_actors: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: true
          require_last_push_approval: false
          required_review_thread_resolution: true
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: DCO
              integration_id: 1861

labels:
  include:
    - name: editorial
      color: '0075ca'
      description: No normative specification change
    - name: normative
      color: d93f0b
      description: Changes a specification requirement
    - name: stale
      color: ededed
      description: Awaiting author response under the ANS inactivity policy
    - name: needs-info
      color: d876e3
      description: Additional information is needed
