name: DCO

# Thin caller for this repo's own PRs. The shared check itself lives in
# dco-check.yml in this repository and is referenced by path so pull
# requests here always exercise the version they change.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    uses: ./.github/workflows/dco-check.yml
